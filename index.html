<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100vh; width: 100vw; overflow: hidden; }

    /* Target every possible chat window class */
    [class*="chat-window"],
    [class*="n8n-chat"] {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* Hide toggle button */
    [class*="chat-toggle"],
    [class*="toggle"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
    createChat({
      webhookUrl: 'https://nexgen-ai.app.n8n.cloud/webhook/5f3c279c-1cab-4ef3-b7d5-f2561c6a8a6c',
      mode: 'window',
      defaultOpen: true,
      showWelcomeScreen: false,
      initialMessages: ['Hi! How can I help you today?'],
    });
  </script>
</body>
</html>

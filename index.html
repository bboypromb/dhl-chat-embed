<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    #n8n-chat { height: 100vh; width: 100vw; display: flex; flex-direction: column; }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet"/>
</head>
<body>
  <div id="n8n-chat"></div>
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
    createChat({
      webhookUrl: 'https://nexgen-ai.app.n8n.cloud/webhook/5f3c279c-1cab-4ef3-b7d5-f2561c6a8a6c',
      target: '#n8n-chat',
      mode: 'fullscreen',
      initialMessages: ['Hi! How can I help you today?'],
    });
  </script>
</body>
</html>
